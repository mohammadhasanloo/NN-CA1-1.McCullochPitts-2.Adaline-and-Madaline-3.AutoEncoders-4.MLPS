[project]
name = "classical-neural-networks"
version = "1.0.0"
description = "McCulloch-Pitts, Adaline and Madaline implemented from scratch with numpy"
requires-python = ">=3.10"
dependencies = ["matplotlib>=3.8", "numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
classic-nets-demo = "classic_nets.demo:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["classic_nets*"]
